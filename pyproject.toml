[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opentetrd"
version = "0.1.0"
description = "Safe USB phone-to-desktop TCP relay prototype"
requires-python = ">=3.11"

[project.scripts]
opentetrd-desktop = "opentetrd.desktop:main"
opentetrd-phone = "opentetrd.phone_relay:main"

# `tests` is a second top-level package, so setuptools refuses to guess. Be explicit.
[tool.setuptools]
packages = ["opentetrd"]
